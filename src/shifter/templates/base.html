<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}shifter{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <script>
    // Copy-to-clipboard for chips marked with [data-copy]. Brief inline feedback,
    // no toast library, no external deps.
    document.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-copy]");
      if (!btn) return;
      var text = btn.getAttribute("data-copy");
      navigator.clipboard.writeText(text).then(function () {
        var orig = btn.getAttribute("data-orig-label") || btn.innerHTML;
        if (!btn.getAttribute("data-orig-label")) btn.setAttribute("data-orig-label", orig);
        btn.classList.add("copied");
        btn.innerHTML = '<span class="copy-val">Copied “' + text + '”</span>';
        setTimeout(function () {
          btn.classList.remove("copied");
          btn.innerHTML = orig;
        }, 1100);
      });
    });

    // Clear-button next to optional date / datetime inputs. Markup is
    //   <span class="input-clearable"><input ...><button class="input-clear-btn">×</button></span>
    // Event-delegated so HTMX-swapped fragments work without re-binding.
    document.addEventListener("click", function (e) {
      var btn = e.target.closest(".input-clear-btn");
      if (!btn) return;
      e.preventDefault();
      var input = btn.parentElement && btn.parentElement.querySelector("input");
      if (!input) return;
      input.value = "";
      input.dispatchEvent(new Event("change", { bubbles: true }));
    });

    // Close any open <details class="confirm"> when the user clicks outside
    // it. <details> doesn't get click-outside semantics for free, so we
    // listen at document level and bulk-close. Same listener works for the
    // shift close-end-time popup, delete confirms, and any future confirm
    // surface that follows the same markup.
    document.addEventListener("click", function (e) {
      document.querySelectorAll("details.confirm[open]").forEach(function (d) {
        if (!d.contains(e.target)) d.removeAttribute("open");
      });
    });

    // Toggle a target element's [hidden] attribute on click. Used for
    // accordion-style table rows where the form row spans the full table
    // width (colspan) — neither <details> nor CSS sibling selectors can
    // span across <tr>s, so we lean on a tiny JS handler.
    //   <button data-toggle-row="pay-row-42">Mark paid</button>
    //   <tr id="pay-row-42" hidden>...</tr>
    document.addEventListener("click", function (e) {
      var trigger = e.target.closest("[data-toggle-row]");
      if (!trigger) return;
      var id = trigger.getAttribute("data-toggle-row");
      var target = document.getElementById(id);
      if (!target) return;
      e.preventDefault();
      if (target.hasAttribute("hidden")) {
        target.removeAttribute("hidden");
        trigger.setAttribute("aria-expanded", "true");
      } else {
        target.setAttribute("hidden", "");
        trigger.setAttribute("aria-expanded", "false");
      }
    });
  </script>
</head>
<body>
  <header class="container topbar">
    {% set p = request.url.path %}
    <nav>
      <ul>
        <li><a href="/" class="brand{% if p == '/' %} active{% endif %}"
               {% if p == '/' %}aria-current="page"{% endif %}><strong>shifter</strong></a></li>
      </ul>
      <ul>
        <li><a href="/shifts"   {% if p.startswith('/shifts')   %}class="active" aria-current="page"{% endif %}>Shifts</a></li>
        <li><a href="/schedule" {% if p.startswith('/schedule') %}class="active" aria-current="page"{% endif %}>Schedule</a></li>
        <li><a href="/nannies"  {% if p.startswith('/nannies')  %}class="active" aria-current="page"{% endif %}>Nannies</a></li>
        <li><a href="/reports"  {% if p.startswith('/reports')  %}class="active" aria-current="page"{% endif %}>Reports</a></li>
      </ul>
      <ul>
        <li><small class="user">{{ user }}</small></li>
      </ul>
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
