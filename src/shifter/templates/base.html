<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}shifter{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <script>
    // Copy-to-clipboard for chips marked with [data-copy]. Brief inline feedback,
    // no toast library, no external deps.
    document.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-copy]");
      if (!btn) return;
      var text = btn.getAttribute("data-copy");
      navigator.clipboard.writeText(text).then(function () {
        var orig = btn.getAttribute("data-orig-label") || btn.innerHTML;
        if (!btn.getAttribute("data-orig-label")) btn.setAttribute("data-orig-label", orig);
        btn.classList.add("copied");
        btn.innerHTML = '<span class="copy-val">Copied “' + text + '”</span>';
        setTimeout(function () {
          btn.classList.remove("copied");
          btn.innerHTML = orig;
        }, 1100);
      });
    });

    // Combine the date + time inputs of a [data-dt-field] (see _macros.html's
    // datetime_field) into its hidden field as 'YYYY-MM-DDTHH:MM'. We split
    // datetime-local into two natively-supported inputs because several mobile
    // browsers (e.g. Firefox for Android) render no usable datetime-local picker.
    function syncDtField(field) {
      var d = field.querySelector("[data-dt-date]");
      var t = field.querySelector("[data-dt-time]");
      var h = field.querySelector("[data-dt-hidden]");
      if (!d || !t || !h) return;
      h.value = (d.value && t.value) ? (d.value + "T" + t.value) : "";
    }
    // Sync on every edit. Both events are needed: some mobile pickers fire only
    // 'change', some only 'input'. Event-delegated so HTMX swaps just work.
    ["input", "change"].forEach(function (evt) {
      document.addEventListener(evt, function (e) {
        var field = e.target.closest && e.target.closest("[data-dt-field]");
        if (field) syncDtField(field);
      });
    });

    // Clear-button for optional date / datetime fields. Empties every input in
    // the wrapper (hidden + date + time) and fires change so syncDtField runs.
    // Event-delegated so HTMX-swapped fragments work without re-binding.
    document.addEventListener("click", function (e) {
      var btn = e.target.closest(".input-clear-btn");
      if (!btn || !btn.parentElement) return;
      e.preventDefault();
      btn.parentElement.querySelectorAll("input").forEach(function (input) {
        input.value = "";
        input.dispatchEvent(new Event("change", { bubbles: true }));
      });
    });

    // Close any open <details class="confirm"> when the user clicks outside
    // it. <details> doesn't get click-outside semantics for free, so we
    // listen at document level and bulk-close. Same listener works for the
    // shift close-end-time popup, delete confirms, and any future confirm
    // surface that follows the same markup.
    document.addEventListener("click", function (e) {
      document.querySelectorAll("details.confirm[open]").forEach(function (d) {
        if (!d.contains(e.target)) d.removeAttribute("open");
      });
    });

    // Lightbox for snapshot thumbnails: <a href="/screenshots/…" data-lightbox>.
    // First click opens the image fitted to the viewport; clicking the image
    // toggles native-resolution zoom (the overlay scrolls); click the backdrop,
    // the × or press Escape to close. Event-delegated so HTMX-swapped cards work.
    function lightboxEl() { return document.getElementById("lightbox"); }
    function closeLightbox() {
      var lb = lightboxEl();
      if (!lb) return;
      lb.setAttribute("hidden", "");
      lb.classList.remove("zoomed");
      lb.querySelector("img").removeAttribute("src");
      document.body.classList.remove("lightbox-open");
    }
    document.addEventListener("click", function (e) {
      var link = e.target.closest("a[data-lightbox]");
      if (!link) return;
      var lb = lightboxEl();
      if (!lb) return;   // no lightbox on this page: fall through to the plain link
      e.preventDefault();
      var img = lb.querySelector("img");
      img.src = link.getAttribute("href");
      img.alt = link.getAttribute("data-caption") || "";
      lb.querySelector(".lightbox-caption").textContent = link.getAttribute("data-caption") || "";
      lb.classList.remove("zoomed");
      lb.removeAttribute("hidden");
      document.body.classList.add("lightbox-open");
    });
    document.addEventListener("click", function (e) {
      var lb = lightboxEl();
      if (!lb || lb.hasAttribute("hidden")) return;
      if (e.target.closest(".lightbox-close") || e.target === lb) { closeLightbox(); return; }
      if (e.target.closest("#lightbox img")) {
        lb.classList.toggle("zoomed");
        if (lb.classList.contains("zoomed")) {
          // Centre the zoomed image on the point that was clicked.
          var img = e.target;
          var rx = (e.clientX - img.getBoundingClientRect().left) / img.clientWidth;
          var ry = (e.clientY - img.getBoundingClientRect().top) / img.clientHeight;
          requestAnimationFrame(function () {
            lb.scrollLeft = rx * img.naturalWidth - lb.clientWidth / 2;
            lb.scrollTop  = ry * img.naturalHeight - lb.clientHeight / 2;
          });
        }
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeLightbox();
    });

    // Add another blank expense row on the new-shift form.
    document.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-add-expense-row]");
      if (!btn) return;
      e.preventDefault();
      var list = document.getElementById(btn.getAttribute("data-add-expense-row"));
      var tmpl = list && list.querySelector("template");
      if (!tmpl) return;
      list.insertBefore(tmpl.content.cloneNode(true), tmpl);
      var rows = list.querySelectorAll(".expense-row");
      var last = rows[rows.length - 1];
      var first = last && last.querySelector("input");
      if (first) first.focus();
    });

    // Toggle a target element's [hidden] attribute on click. Used for
    // accordion-style table rows where the form row spans the full table
    // width (colspan) — neither <details> nor CSS sibling selectors can
    // span across <tr>s, so we lean on a tiny JS handler.
    //   <button data-toggle-row="pay-row-42">Mark paid</button>
    //   <tr id="pay-row-42" hidden>...</tr>
    document.addEventListener("click", function (e) {
      var trigger = e.target.closest("[data-toggle-row]");
      if (!trigger) return;
      var id = trigger.getAttribute("data-toggle-row");
      var target = document.getElementById(id);
      if (!target) return;
      e.preventDefault();
      if (target.hasAttribute("hidden")) {
        target.removeAttribute("hidden");
        trigger.setAttribute("aria-expanded", "true");
      } else {
        target.setAttribute("hidden", "");
        trigger.setAttribute("aria-expanded", "false");
      }
    });
  </script>
</head>
<body>
  <header class="container topbar">
    {% set p = request.url.path %}
    <nav>
      <ul>
        <li><a href="/" class="brand{% if p == '/' %} active{% endif %}"
               {% if p == '/' %}aria-current="page"{% endif %}><strong>shifter</strong></a></li>
      </ul>
      <ul>
        <li><a href="/shifts"   {% if p.startswith('/shifts')   %}class="active" aria-current="page"{% endif %}>Shifts</a></li>
        <li><a href="/review"   {% if p.startswith('/review')   %}class="active" aria-current="page"{% endif %}>Review</a></li>
        <li><a href="/schedule" {% if p.startswith('/schedule') %}class="active" aria-current="page"{% endif %}>Schedule</a></li>
        <li><a href="/nannies"  {% if p.startswith('/nannies')  %}class="active" aria-current="page"{% endif %}>Nannies</a></li>
        <li><a href="/reports"  {% if p.startswith('/reports')  %}class="active" aria-current="page"{% endif %}>Reports</a></li>
      </ul>
      <ul>
        <li><small class="user">{{ user }}</small></li>
      </ul>
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Snapshot">
    <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
    <img alt="">
    <div class="lightbox-caption"></div>
  </div>
</body>
</html>
